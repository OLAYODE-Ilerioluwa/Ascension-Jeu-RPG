<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ascension · Maquette combat (mood board)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    overflow: hidden; user-select: none;
  }
  :root { /* palette de base = extrait de la palette choisie par l'utilisateur */
    --bg: #0e0d11; --panel: #1d1a3a; --panel2: #26224d;
    --accent: #6f7bf0; --accent2: #b8c0f5; --enemy: #ea2e5e;
    --text: #f2ede9; --muted: #8b88a8;
  }

  /* Sélecteur de palier (pour visualiser la palette évolutive) */
  .paliers { display: flex; gap: 8px; padding: 12px 16px; align-items: center; }
  .paliers span { font-size: 12px; color: var(--muted); margin-right: 6px; letter-spacing: 1px; }
  .paliers button {
    font: inherit; font-size: 12px; padding: 6px 14px; border-radius: 20px;
    border: 1px solid var(--muted); background: transparent; color: var(--muted);
    cursor: pointer; transition: all .2s;
  }
  .paliers button:hover { color: var(--text); border-color: var(--text); }
  .paliers button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

  /* Scène de combat */
  .scene { flex: 1; position: relative; display: flex; align-items: flex-end; justify-content: space-around; padding: 0 8vw 6vh; }
  .halo { position: absolute; border-radius: 50%; height: 55%; width: 30vw;
    top: 8%; left: 50%; transform: translateX(-50%); background: var(--halo, transparent); opacity: .12; transition: background 1s; }

  .cote { position: relative; z-index: 2; text-align: center; width: 300px; }

  /* Barres PV / mana */
  .infos { background: var(--panel); border: 1px solid var(--panel2); border-radius: 12px; padding: 12px 14px; margin-top: 22px; text-align: left; }
  .infos .ligne { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .barre { height: 12px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; margin-bottom: 8px; }
  .pv > .rempli { width: 100%; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #3ecf6e, #6ee08a); transition: width .4s; }
  .mana > .rempli { width: 70%; height: 100%; border-radius: 6px; background: var(--accent); transition: width .4s; }
  .mana .ligne { color: var(--accent2); }

  /* Personnage en flat design (formes simples) */
  .perso { position: relative; height: 220px; }
  .corps { position: absolute; inset: 0 40px; transition: transform .35s; }
  .perso.hit { transform: translateX(0) scale(.96); filter: brightness(2.2); }

  /* Héros : cape + tête + socle */
  .heros .cape { position: absolute; bottom: 26px; left: 45px; width: 130px; height: 150px;
    border-radius: 60px 60px 12px 12px; background: var(--accent); }
  .heros .tete { position: absolute; bottom: 148px; left: 75px; width: 70px; height: 76px;
    border-radius: 32px 32px 18px 18px; background: var(--accent2); }
  .heros .oeil1, .heros .oeil2 { position: absolute; bottom: 172px; width: 10px; height: 14px;
    border-radius: 5px; background: #16202e; }
  .heros .oeil1 { left: 95px; } .heros .oeil2 { left: 118px; }
  .heros .epee { position: absolute; bottom: 60px; left: 175px; width: 14px; height: 160px;
    border-radius: 7px; background: #cfd8e6; transform: rotate(14deg); }
  .heros .epee::before { content: ''; position: absolute; top: 96px; left: -22px; width: 58px; height: 14px;
    border-radius: 7px; background: var(--accent); }

  /* Ennemi : blob sombre + yeux */
  .ennemi .corps-en { position: absolute; bottom: 30px; left: 20px; width: 200px; height: 160px;
    border-radius: 48% 52% 44% 56% / 64% 60% 40% 36%; background: var(--enemy); }
  .ennemi .oeil1, .ennemi .oeil2 { position: absolute; bottom: 116px; width: 16px; height: 20px;
    border-radius: 8px; background: #12060a; }
  .ennemi .oeil1 { left: 68px; } .ennemi .oeil2 { left: 148px; }

  .socle { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 210px; height: 20px; border-radius: 50%; background: rgba(255,255,255,.05); }

  /* Chiffres de dégâts flottants */
  .degat { position: absolute; font-size: 34px; font-weight: 900; z-index: 9;
    animation: monte 1.1s ease-out forwards; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
  .degat.blanc { color: #fff; } .degat.jaune { color: #ffd94e; font-size: 44px; }
  .degat.bleu { color: var(--accent2); }
  @keyframes monte { 0% { transform: translateY(0) scale(.6); opacity: 0; }
    15% { opacity: 1; transform: translateY(-22px) scale(1.15); }
    100% { transform: translateY(-90px) scale(1); opacity: 0; } }

  /* Flash d'impact */
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 8; }
  .flash.on { animation: imp 0.22s ease-out; }
  @keyframes imp { 0% { opacity: .55; } 100% { opacity: 0; } }

  /* Boutons d'action : colonne verticale à gauche, derrière le perso */
  .actions { position: fixed; left: 20px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px; width: 190px; z-index: 1; }
  .actions button {
    font: inherit; font-weight: 700; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; text-align: left;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--panel2); border-radius: 12px; padding: 12px 16px; transition: all .15s;
  }
  .actions button:hover { border-color: var(--accent); transform: translateX(4px); }
  .actions button:active { transform: translateX(0); }
  .actions svg { width: 18px; height: 18px; flex-shrink: 0; stroke: var(--accent2); fill: none; stroke-width: 2; }

  .note { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 14px; }
</style>
</head>
<body>

<section class="paliers">
  <span>PALETTE PAR PALIER →</span>
  <button data-p="base" class="on">E 1–8 · Base</button>
  <button data-p="milieu">E 9–16 · Milieu</button>
  <button data-p="haut">E 17–24 · Haut</button>
  <button data-p="sommet">E 25 · Sommet</button>
</section>

<section class="scene">
  <div class="halo"></div>
  <div class="flash"></div>

  <div class="cote">
    <div class="perso heros">
      <div class="socle"></div>
      <div class="corps">
        <div class="cape"></div><div class="tete"></div>
        <div class="oeil1"></div><div class="oeil2"></div><div class="epee"></div>
      </div>
    </div>
    <div class="infos">
      <div class="ligne"><span>ASCENSION</span><span>Nv 3</span></div>
      <div class="barre pv"><div class="rempli" id="hpv"></div></div>
      <div class="ligne"><span style="color:var(--text)">PV 84/84</span><span style="color:var(--muted)">Mana</span><span style="color:var(--text)" id="hmana">42/60</span></div>
      <div class="barre mana"><div class="rempli" id="hmana2"></div></div>
    </div>
  </div>

  <div class="cote">
    <div class="perso ennemi">
      <div class="socle"></div>
      <div class="corps-en" id="corpsEn"></div>
      <div class="oeil1"></div><div class="oeil2"></div>
    </div>
    <div class="infos">
      <div class="ligne"><span style="color:var(--enemy)">GOBLIN</span><span style="color:var(--muted)">étage 4</span></div>
      <div class="barre pv"><div class="rempli" id="epv"></div></div>
      <div class="ligne"><span style="color:var(--text)">PV 70</span><span style="color:var(--muted)">ATQ 20 · DÉF 10</span></div>
    </div>
  </div>
</section>

<section class="actions">
  <button onclick="frapper(28,'blanc')">
    <svg viewBox="0 0 24 24"><path d="M4 20l6-6M14 4l6 6-8 8-6-6 8-8z"/></svg>Attaquer
  </button>
  <button onclick="frapper(45,'bleu')">
    <svg viewBox="0 0 24 24"><path d="M12 2c2 4 6 6 6 11a6 6 0 1 1-12 0c0-5 4-7 6-11z"/></svg>Magique <small style="color:var(--muted)">−10 mana</small>
  </button>
  <button onclick="frapper(70,'jaune')">
    <svg viewBox="0 0 24 24"><path d="M12 2l2.5 7H22l-6 4.5L18.5 21 12 16.5 5.5 21 8 13.5 2 9h7.5L12 2z"/></svg>Spéciale
  </button>
  <button onclick="frapper(0,'blanc')">
    <svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6l8-3z"/></svg>Défense
  </button>
  <button onclick="frapper(0,'blanc')">
    <svg viewBox="0 0 24 24"><path d="M10 3h4v5l4 9a4 4 0 0 1-4 5h-4a4 4 0 0 1-4-5l4-9V3z"/></svg>Potion
  </button>
</section>

<p class="note">MOOD BOARD · clique les boutons pour voir dégâts, flash et barres bouger · la palette change selon le palier choisi en haut</p>

<script>
  const palettes = {
    // les 4 paliers suivent la rampe unique choisie : noir → lavande → bleu-violet → violet → rose/rouge
    base:   { bg:'#0e0d11', panel:'#1d1a3a', panel2:'#26224d', accent:'#6f7bf0', accent2:'#b8c0f5', enemy:'#ea2e5e', text:'#f2ede9', halo:'#6f7bf0' },
    milieu: { bg:'#120f1e', panel:'#2a2145', panel2:'#382a5c', accent:'#8a5cf0', accent2:'#c982c9', enemy:'#e8547c', text:'#f2e9f5', halo:'#8a5cf0' },
    haut:   { bg:'#190d16', panel:'#3a1030', panel2:'#4d1838', accent:'#ea2e5e', accent2:'#f0a0b8', enemy:'#f0c2e8', text:'#f8eef2', halo:'#ea2e5e' },
    sommet: { bg:'#08040a', panel:'#2b0716', panel2:'#3d0a20', accent:'#e8175d', accent2:'#c8ccf8', enemy:'#c8ccf8', text:'#f2ede9', halo:'#e8175d' }
  };
  const pvEn = document.getElementById('epv');
  const pvH = document.getElementById('hmana');
  let hpEnemy = 70, hpHero = 100;

  document.querySelectorAll('.paliers button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.paliers button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      const p = palettes[b.dataset.p];
      for (const [k, v] of Object.entries(p)) document.documentElement.style.setProperty('--' + k, v);
      // au sommet, l'ennemi est un boss doré
      document.getElementById('corpsEn').style.background = b.dataset.p === 'sommet' ? palettes.sommet.enemy : p.enemy;
    };
  });

  function frapper(dmg, type) {
    const flash = document.querySelector('.flash');
    flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
    if (dmg > 0) {
      const d = document.createElement('div');
      d.className = 'degat ' + type;
      d.textContent = '-' + dmg;
      d.style.left = (58 + Math.random() * 8) + '%';
      d.style.top = (30 + Math.random() * 10) + '%';
      document.querySelector('.scene').appendChild(d);
      setTimeout(() => d.remove(), 1200);
      hpEnemy = Math.max(0, hpEnemy - dmg);
    }
    pvEn.style.width = (hpEnemy / 70 * 100) + '%';
    const corEn = document.querySelector('.ennemi');
    corEn.classList.add('hit'); setTimeout(() => corEn.classList.remove('hit'), 260);
    if (hpEnemy === 0 && hpHero > 0) {
      setTimeout(() => { alert('Victoire ! → écran boutique / trésor / repos (à maquetter ensuite)'); hpEnemy = 70; }, 500);
    }
  }
</script>
</body>
</html>
